name: Build Module CRC Bypass KPM

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Push a new release"
        required: false
        default: "false"
      version:
        description: "Release version"
        required: false
        default: "1.0.0"
  push:
    paths:
      - ".github/workflows/main.yml"
      - "**/*.c"
      - "**/*.h"
      - "Makefile"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KERNELPATCH_REF: "0.11.2"
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Install packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y file zip unzip

      - name: Download KernelPatch SDK
        shell: bash
        run: |
          set -eux
          curl -L "https://github.com/bmax121/KernelPatch/archive/refs/tags/${KERNELPATCH_REF}.tar.gz" -o KernelPatch.tar.gz
          mkdir -p KernelPatch
          tar xzf KernelPatch.tar.gz --strip-components=1 -C KernelPatch

      - name: Build KPM module
        shell: bash
        run: |
          set -eux
          make \
            KP_DIR="$GITHUB_WORKSPACE/KernelPatch" \
            ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"

      - name: Collect artifacts
        shell: bash
        run: |
          set -eux
          mkdir -p artifacts
          KPM_FILE="$(ls -1 module_crc_bypass_*.kpm | sort -V | tail -n 1)"
          cp "$KPM_FILE" artifacts/
          file artifacts/module_crc_bypass_*.kpm
          ls -lh artifacts/module_crc_bypass_*.kpm

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: module_crc_bypass
          path: artifacts/module_crc_bypass_*.kpm
          if-no-files-found: error
          retention-days: 90

      - name: Upload release
        if: github.event.inputs.release == 'true' && success() && !cancelled()
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ github.event.inputs.version }}
          tag: v${{ github.event.inputs.version }}
          body: "Module CRC Bypass KPM v${{ github.event.inputs.version }}"
          artifacts: "artifacts/module_crc_bypass_*.kpm"
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true
